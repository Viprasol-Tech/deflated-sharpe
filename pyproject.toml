[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deflated-sharpe"
version = "0.1.0"
description = "Is your best backtest real? Deflated Sharpe Ratio, PSR, MinTRL and PBO (CSCV) — zero dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Viprasol Tech Private Limited", email = "support@viprasol.com" }]
keywords = [
    "deflated-sharpe-ratio",
    "backtest-overfitting",
    "probabilistic-sharpe-ratio",
    "pbo",
    "cscv",
    "quant",
    "backtesting",
    "trading",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.5,<0.16",
    "mypy>=1.10",
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/Viprasol-Tech/deflated-sharpe"
Repository = "https://github.com/Viprasol-Tech/deflated-sharpe"
Issues = "https://github.com/Viprasol-Tech/deflated-sharpe/issues"
Website = "https://viprasol.com"

[project.scripts]
dsr = "deflated_sharpe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deflated_sharpe"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
